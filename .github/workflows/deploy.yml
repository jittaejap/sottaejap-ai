# main에 머지되면 이미지를 구워 Docker Hub에 올리고, EC2는 받아서 켜기만 한다.
# compose 파일은 sottaejap-server가 소유한다. 여기서는 EC2에 이미 있는 것을 쓴다.
#
# 필요한 Secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST         탄력적 IP 또는 api.clearpng.cloud
#   EC2_SSH_KEY      sottaejap-key.pem 파일 내용 전체
#   DOCKERHUB_TOKEN  Docker Hub 액세스 토큰 (계정 jinocc, 비밀번호 아님)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 레포에서 배포가 겹치지 않게 한다. 레포끼리 겹치는 것은 EC2의 flock이 막는다.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: jinocc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드와 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest는 EC2가 받아 쓰고, 커밋 해시 태그는 되돌릴 때 쓴다.
          tags: |
            jinocc/sottaejap-ai:latest
            jinocc/sottaejap-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: 재배포와 헬스체크
        run: |
          ssh -i ~/.ssh/deploy.pem ubuntu@${{ secrets.EC2_HOST }} \
            "DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}' bash -se" <<'EOS'
          set -euo pipefail

          COMPOSE_DIR=~/apps/sottaejap-server/deploy
          if [ ! -f "$COMPOSE_DIR/docker-compose.yml" ]; then
            echo "compose 파일이 EC2에 없다. sottaejap-server를 먼저 배포해야 한다."
            exit 1
          fi

          # server와 ai 배포가 동시에 들어와도 한 번에 하나만 돌게 한다.
          exec 9>/tmp/sottaejap-deploy.lock
          flock -w 300 9

          echo "$DOCKERHUB_TOKEN" | docker login -u jinocc --password-stdin

          cd "$COMPOSE_DIR"
          dc() { docker compose --env-file "$HOME/apps/.env" "$@"; }

          dc pull ai
          dc up -d ai

          # 8000은 127.0.0.1에만 열려 있어 EC2 안에서만 확인할 수 있다.
          for _ in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "ai UP"
              exit 0
            fi
            sleep 5
          done

          echo "헬스체크 실패 — 최근 로그"
          dc logs --tail=80 ai
          exit 1
          EOS
