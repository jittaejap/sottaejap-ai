name: 리팩터링
description: 기존 동작을 유지하면서 코드나 구조를 개선합니다.
title: '[Refactor] '
body:
  - type: dropdown
    id: affected-area
    attributes:
      label: 영향 영역
      description: 리팩터링할 영역을 선택해 주세요.
      options:
        - "/chat API · DTO (api · schemas)"
        - Agent · 프롬프트 · Tool Calling (agent · tools)
        - Spring 연동 (clients)
        - 회고 구조화 · 표준 태그 (reflection)
        - LLM 호출 · 폴백 템플릿 (core/llm · ai/fallback)
        - 금융 RAG (rag · scripts)
        - 설정 · 의존성 · Docker
        - CI/CD · 배포
        - 문서
        - 여러 영역
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 리팩터링 대상
      description: 개선할 코드, 모듈, 설정 또는 구조를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 개선 이유
      description: 현재 구조의 문제와 개선이 필요한 이유를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: direction
    attributes:
      label: 변경 방향
      description: 구조를 어떻게 바꿀지 구체적으로 작성해 주세요. 새 프레임워크나 추상화를 도입한다면 왜 필요한지 함께 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: preserved-behavior
    attributes:
      label: 유지할 동작
      description: 리팩터링 전후에 동일하게 유지해야 하는 동작과 계약(/chat DTO · SpringClient 경로 · 계층 경계)을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 위험과 대응
      description: 예상되는 회귀 위험과 대응 방법을 작성해 주세요. 없다면 "없음"으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 기존 동작이 유지되는지 확인할 테스트와 수동 검증을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: 완료 조건
      description: 리팩터링이 완료됐다고 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] 기존 동작과 계약이 유지된다.
        - [ ] pytest 전체가 통과한다.
    validations:
      required: true
